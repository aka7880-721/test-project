<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>misa.lol — Profile editor</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="wrap">
    <header class="page-header">
      <h1>Profile editor</h1>
      <p class="sub">Edit your profile and see a live preview.</p>
    </header>

    <div class="layout">
      <!-- Form ------------------------------------------------------- -->
      <section class="panel" aria-labelledby="form-heading">
        <h2 id="form-heading">Edit</h2>

        <div id="load-error" class="banner banner--error" hidden role="alert"></div>

        <form id="profile-form" novalidate>
          <div class="field">
            <label for="displayName">Display name</label>
            <input
              id="displayName"
              name="displayName"
              type="text"
              maxlength="80"
              autocomplete="off"
              aria-describedby="displayName-error"
            />
            <p id="displayName-error" class="field-error" hidden></p>
          </div>

          <div class="field">
            <label for="bio">Bio</label>
            <textarea
              id="bio"
              name="bio"
              rows="4"
              maxlength="320"
              aria-describedby="bio-error"
            ></textarea>
            <p id="bio-error" class="field-error" hidden></p>
          </div>

          <div class="field">
            <label for="linkLabel">Link label</label>
            <input
              id="linkLabel"
              name="linkLabel"
              type="text"
              maxlength="60"
              autocomplete="off"
              aria-describedby="linkLabel-error"
            />
            <p id="linkLabel-error" class="field-error" hidden></p>
          </div>

          <div class="field">
            <label for="linkUrl">Link URL</label>
            <input
              id="linkUrl"
              name="linkUrl"
              type="text"
              inputmode="url"
              autocomplete="off"
              aria-describedby="linkUrl-error"
            />
            <p id="linkUrl-error" class="field-error" hidden></p>
          </div>

          <div class="actions">
            <button id="save-button" type="submit">Save</button>
            <span id="save-status" class="status" role="status" aria-live="polite"></span>
          </div>

          <div id="save-error" class="banner banner--error" hidden role="alert"></div>
        </form>
      </section>

      <!-- Preview ---------------------------------------------------- -->
      <section class="panel" aria-labelledby="preview-heading">
        <h2 id="preview-heading">Preview</h2>
        <article class="profile-card">
          <h3 id="preview-name" class="profile-name"></h3>
          <p id="preview-bio" class="profile-bio"></p>
          <p id="preview-link-wrap" class="profile-link-wrap">
            <a id="preview-link" href="#" rel="noopener noreferrer"></a>
          </p>
        </article>
      </section>
    </div>
  </main>

  <script src="/app.js"></script>
</body>
</html>
